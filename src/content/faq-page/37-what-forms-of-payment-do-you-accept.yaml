anchor: what-forms-of-payment-do-you-accept
question: >-
  What forms of payment do you accept?
answer: >-
  <p>We currently accept all major credit cards, and a range of
  cryptocurrencies including <b>Bitcoin, Litecoin, Ethereum, USDCoin, Monero,
  Tether ERC20, and Tether TRC20</b> in exchange for credits.</p>
