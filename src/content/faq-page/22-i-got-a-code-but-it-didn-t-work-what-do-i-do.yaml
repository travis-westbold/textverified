category: Verifications
anchor: i-got-a-code-but-it-didn-t-work-what-do-i-do
question: >-
  I got a code, but it didn't work! What do I do?
answer: >-
  <p>Please <a href="https://www.textverified.com/app/support">contact
  support</a> with the phone number and a detailed description of what
  happened. Please take a screenshot of the error/issue from the website you
  were requesting a verification from and make sure the device's time is
  clearly on display in the screenshot. You may have used the “resend code”
  option from the service provider or you might have clicked on the “send
  code” option multiple times—we will only provide the first code that we
  get.</p>
