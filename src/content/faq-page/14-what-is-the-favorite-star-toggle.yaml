order: 14
category: Verifications
anchor: what-is-the-favorite-star-toggle
question: >-
  What is the “Favorite” star toggle?
answer: >-
  <p>Services that you mark as a favorite (indicated by a ★) will show up on
  the top of the services list to make it easier for you to find those
  services. You can remove a service from your favorites by toggling the star
  (★) again.</p>
