order: 17
category: Verifications
anchor: can-i-use-the-same-number-again
question: >-
  Can I use the same number again?
answer: >-
  <p>After successfully completing a verification, you can reuse the same
  number within 2 minutes of the first verification code coming in. In
  addition, we allow the reactivation of the number as long as we still have
  it in our system. You click on the “Reactivate” option to do this in your
  Verification History. You will be charged again for each subsequent
  verification you do. Keep in mind that outside of the "Verification Reuse
  Window", numbers may be removed from our system at any time. This means
  that if there's even a chance you'll need a number again at a later time,
  please consider our <a href="https://www.textverified.com/rentals">rental
  numbers</a>. Once a number leaves our system, it cannot be recovered.</p>
