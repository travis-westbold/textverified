question: >-
  Where are your numbers from?
answer: >-
  <p>All our numbers come from major US carriers and their affiliates. We
  only have non-VoIP phone numbers meaning each number has a physical SIM
  card associated with it. You can verify any service, even services that do
  not accept virtual numbers. Examples of services we verify are Google
  Voice, Tinder, Telegram, WhatsApp, Venmo, and more.</p>
