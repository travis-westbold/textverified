order: 34
category: Rentals
anchor: i-purchased-a-phone-number-where-is-it
question: >-
  I purchased a phone number, where is it?
answer: >-
  <p>If the line was back ordered then it can take up to 72 hours to fulfill
  and will be listed under <a
  href="https://www.textverified.com/app/rentals/backorders">Rental
  Backorders</a>. If the line was in stock, then it will be on your account
  under <a href="https://www.textverified.com/app/rentals">Active
  Rentals</a>.</p>
