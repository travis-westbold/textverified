order: 41
category: Credits
anchor: credits-were-deducted-from-my-account-but-my-verification
question: >-
  Credits were deducted from my account, but my verification wasn’t
  successful! What do I do?
answer: >-
  <p>Please <a href="https://www.textverified.com/app/support">contact
  support</a> with the phone number and a detailed description of what
  happened. Take a screenshot of the error/issue from the website you were
  requesting a verification from and make sure the device's time is clearly
  on display in the screenshot. We will work with you to try to resolve any
  issues.</p>
