anchor: what-does-non-renewable-mean-compared-to-renewable-lines
question: >-
  What does Non-Renewable mean compared to Renewable lines?
answer: >-
  <p>The key difference is that Non-Renewable lines cannot be renewed OR
  reactivated. However, they can be extended, but must be extended while the
  line is active; generally, this is not as cost effective as purchasing a
  Renewable line. With renewable lines, you can choose to hold on to your
  phone number indefinitely and the price will not go up – as long as you
  continue to pay for it each billing cycle, you'll keep the line as is.</p>
