order: 30
category: Rentals
anchor: can-i-pay-for-a-phone-number-for-more-than-one-billing-cycle
question: >-
  Can I pay for a phone number for more than one billing cycle at a time?
answer: >-
  <p>You can only pay for the phone number one billing cycle at a time. We do
  have an auto-renew system in place. Please make sure to look next to your
  phone number and toggle the "Renew" switch on if you want to keep your
  number for the next cycle, or off if you want to end the rental at the end
  of the cycle.</p>
