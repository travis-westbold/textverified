question: >-
  What makes your service different from Google Voice?
answer: >-
  <p>We offer services to verify your identity to register and login to
  online services (ex: Craigslist, Hinge, and even Google). Google Voice
  numbers are made to be used like an online personal phone. One of Google
  Voice's biggest weaknesses however is that it is a VoIP (Voice Over IP)
  number. When receiving an SMS verification, most services recognize that
  it's a fake phone number and will reject it. Instead, you should use our
  numbers to bypass this limitation.</p>
