question: >-
  If my number rental expires, can I get it back in the future?
answer: >-
  <p>Only with our renewable numbers, IF we still have the number, you can
  reactivate it. There is a $10 reactivation fee, plus we charge the time
  elapsed, and the base cost of the line. You can check your <a
  href="https://www.textverified.com/app/rentals/history">Rental History</a>
  to see if the Reactivate button is available.</p>
