order: 31
category: Rentals
anchor: when-and-how-does-the-line-auto-renew
question: >-
  When and how does the line Auto-Renew?
answer: >-
  <p>If you have enough money in your account for all lines in the billing
  cycle to auto-renew and the lines are set to auto-renew, the lines will
  renew right before they are set to expire.</p>
