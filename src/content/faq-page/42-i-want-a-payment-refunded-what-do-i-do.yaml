order: 42
category: Credits
anchor: i-want-a-payment-refunded-what-do-i-do
question: >-
  I want a payment refunded. What do I do?
answer: >-
  <p>Please <a href="https://www.textverified.com/app/support">contact
  support</a> within 30 days of the original payment and the reason for the
  refund. <b>We assess credit/monetary refunds on a case by case basis and
  will work with you to make it right.</b> Please note that we can only
  refund to the original form of payment. <b>We do not refund cryptocurrency
  payments.</b></p>
