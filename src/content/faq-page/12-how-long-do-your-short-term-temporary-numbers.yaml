question: >-
  How long do your short-term/temporary numbers last?
answer: >-
  <p>All of our verification numbers are meant for short-term and temporary
  use. Once a verification has ended, the number may be removed at any time
  and we will no longer have access to that number. However, we do offer
  long-term phone number rentals if you need a temporary phone number for a
  longer time! Rentals can be rented from one day to an unlimited amount of
  time. <a href="https://www.textverified.com/rentals">Learn more about our
  rentals here</a>.</p>
