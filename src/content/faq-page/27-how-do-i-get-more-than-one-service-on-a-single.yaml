question: >-
  How do I get more than one service on a single phone number?
answer: >-
  <p>You can purchase an “Unlimited Services” 30 day rental (giving you the
  ability to use any service on the phone line) OR a non-renewable number and
  selecting your desired services. You can add the services you want to your
  cart and then during checkout, you can check the box "All On Same Line”
  when purchasing a single line. All services chosen will be associated with
  the same phone number.</p>
