category: Verifications
anchor: how-much-time-do-i-have-to-verify-a-service
question: >-
  How much time do I have to verify a service?
answer: >-
  <p>You will have a short amount of time (between 5 to 15 minutes depending
  on the service) after you've been assigned a number to verify your selected
  service. We only deduct credits if a verification comes in. You'll be able
  to find the verification code in your <a
  href="https://www.textverified.com/app/verifications/history">Verification
  History page</a>.</p>
