question: >-
  Do you have calling features with rentals?
answer: >-
  <p>Currently, our main call offerings are through one time voice
  verifications. We do offer some calling offers in the form of voice
  verifications with some services in our Rentals section. It will clearly
  list this next to the service.</p>
