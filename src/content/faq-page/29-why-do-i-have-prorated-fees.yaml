order: 29
category: Rentals
anchor: why-do-i-have-prorated-fees
question: >-
  Why do I have prorated fees?
answer: >-
  <p>When you purchase a Renewable number and you already have a Renewable
  number on your account, you have two options during Checkout. You can click
  under 'Billing Cycle' to see these options. You can place the number on an
  already existing billing cycle and the line will be prorated (it may
  include another month of purchase), or you can put it on its own cycle and
  be charged the normal 30 day, 90 day, or 1 year price, and your account
  will be charged every 30 days, 90 days, or 1 year, from the time you
  purchased it.</p>
