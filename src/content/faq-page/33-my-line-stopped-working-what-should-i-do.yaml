anchor: my-line-stopped-working-what-should-i-do
question: >-
  My line stopped working, what should I do?
answer: >-
  <p>If you have one of our older manual rentals, press the "Wake Up" button
  and wait until the line is listed as READY before trying again. If the
  issue continues, or if your rental does not use wake mode, <a
  href="https://www.textverified.com/app/support">contact support</a> and
  they will troubleshoot the phone number. Just like any other phone,
  sometimes it just needs to be restarted.</p>
