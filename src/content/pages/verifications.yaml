meta:
  title: Verifications | Textverified
  description: >-
    Temporary non-VoIP US phone numbers for SMS and voice verification.
    Receive one-time passcodes and calls for 700+ services with fast delivery
    and automatic refunds when no code arrives.
  canonical: https://www.textverified.com/verifications
hero:
  kicker: Verification products
  title: Verifications
  mark: { pre: SMS and, em: Voice }
  lede: >-
    Textverified provides temporary non-VoIP US phone numbers to receive SMS
    codes and voice calls for online account verification. Choose your service,
    get a number instantly, and verify in minutes.
  primaryCta: Sign up for Textverified
  secondaryCta: Explore services
sections:
  - id: sms
    kicker: Text / SMS
    tone: dark
    flip: false
    headingPre: SMS
    markEm: Verifications.
    lede: >-
      Use temporary numbers to receive one-time SMS verification codes for the
      services you use most. Fast delivery, clear status updates, and only pay
      when a code arrives.
    steps:
      - { title: Select a service., text: Choose from 700+ supported services and get a temporary number instantly. }
      - { title: Sign up., text: Enter that number on the website or app you are verifying and request your code. }
      - { title: Verify!, text: Receive your SMS code in your dashboard and complete your account verification. }
    primaryLabel: Learn more
    primaryLink: sms
  - id: voice
    kicker: Voice
    tone: deep
    flip: true
    ink: false
    headingPre: Voice
    markEm: Verifications.
    lede: >-
      Need call-based verification? Receive voice calls on temporary non-VoIP
      numbers and verify accounts with the same fast, reliable flow.
    steps:
      - { title: Select a voice service., text: Pick a supported voice service and claim a temporary number. }
      - { title: Wait for your call., text: Enter your number on the service and wait while your verification call connects. }
      - { title: Verify!, text: Follow call instructions and complete your verification once connected. }
    primaryLabel: Learn more
    primaryLink: sms
extras:
  kicker: Verifications
  heading: Additional features.
  cards:
    - icon: refresh
      title: Reactivate
      body: >-
        Need another code from the same number? Reactivate recent verifications
        in seconds while availability lasts.
    - icon: globe
      title: Area Codes
      body: >-
        Filter by area code to use numbers from specific regions when your
        workflow requires it.
    - icon: refund
      title: Automatic Refunds
      body: >-
        If no SMS or call is received, your credits are refunded automatically.
    - icon: list
      title: 700+ Services
      body: >-
        Verify across hundreds of major apps, websites, and online platforms.
    - icon: bolt
      title: Instant Delivery
      body: >-
        Get temporary numbers and incoming verification updates in real time.
    - icon: chat
      title: SMS + Voice
      body: >-
        Choose the verification method you need for each service: SMS, voice,
        or both.
signupCta:
  heading: Use our numbers to verify anything.
  body: >-
    From one-off account signups to high-volume verification workflows,
    Textverified gives you fast access to temporary non-VoIP US numbers for SMS
    and voice.
  buttonLabel: Create an account
