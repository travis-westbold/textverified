order: 4
question: What can I use your numbers for?
answer: >-
  Our numbers can be used for virtually any online service including popular
  ones like Amazon, Gmail, and PayPal. You can use these numbers to register
  for new accounts, keep your information private, and stop one-time-codes
  (OTP) from spamming your personal phone. In addition, if a service is not
  listed, you can still get SMS codes from custom services!
