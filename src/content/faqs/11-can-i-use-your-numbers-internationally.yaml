order: 11
question: I live internationally, can I still use your numbers?
answer: >-
  Absolutely! Our numbers are all based in the US, but you can get messages
  through our website if you live in countries like India, the UK, Canada,
  Germany, Nigeria, Ghana, Bangladesh, South Africa, Netherlands, and many
  more! Note: Many services require a non-VoIP US number to create a US
  account.
